<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<title>Live2D</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: transparent;
    -webkit-tap-highlight-color: transparent;
    -webkit-user-select: none;
    user-select: none;
  }
  /*
   * 关键：必须让 canvas 脱离普通文档流并建立自己的层叠/合成层。
   *
   * 实测（Adreno 660 + Android WebView 14）：position:static 的 WebGL
   * canvas 不会被提升为独立合成层，页面里所有 DOM 都正常显示，
   * 唯独 canvas 内容永远不上屏 —— 表现为「WebView 合成正常、页面
   * 渲染正常、canvas 像素满格，但屏幕上看不到模型」。
   */
  #stage {
    position: fixed;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    z-index: 1;
    display: block;
    background: transparent;
    /* 双重保险：显式要求浏览器提升为合成层 */
    transform: translateZ(0);
    -webkit-transform: translateZ(0);
    will-change: transform;
  }
  #fallback {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    display: none;
    align-items: center;
    justify-content: center;
    color: #9aa0a6;
    font: 14px/1.7 -apple-system, BlinkMacSystemFont, "Noto Sans SC", sans-serif;
    text-align: center;
    padding: 24px;
    box-sizing: border-box;
  }
  #fallback.show { display: flex; }
</style>
</head>
<body>
  <canvas id="stage"></canvas>
  <div id="fallback"></div>

  <!-- 顺序要求：PixiJS → Cubism Core → pixi-live2d-display → 业务桥接 -->
  <script src="lib/pixi.min.js"></script>
  <script src="lib/live2dcubismcore.min.js"></script>
  <script src="lib/cubism4.min.js"></script>
  <script src="js/bridge.js"></script>
</body>
</html>
